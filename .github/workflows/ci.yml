name: CI

on:
  push:
    branches: [main, staging, feature/admin-individual-mfa, integration/ds-mfa-ux-identity-20261111]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @bimaris/web lint
      - run: pnpm --filter @bimaris/web typecheck
      - run: pnpm --filter @bimaris/mobile typecheck
      - run: pnpm test:auth
      - run: pnpm test:media
      - run: pnpm --filter @bimaris/web build
