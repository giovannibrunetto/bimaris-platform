name: SEC-R01 isolated browser and integrity
on:
  push:
    branches: [fix/dt16-isolated-survey-surface-20261117]
    paths: ['.github/workflows/sec-r01-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sec-r01-browser
  cancel-in-progress: false
jobs:
  replay:
    if: github.ref == 'refs/heads/fix/dt16-isolated-survey-surface-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Install pinned browser harness
        run: |
          npm install --prefix "$RUNNER_TEMP/sec-r01-browser" --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/sec-r01-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Replay canonical schema and exercise isolated Chromium
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD DATABASE_URL
          test ! -f supabase/.temp/project-ref
          test -d supabase/migrations
          printf 'Candidate commit: '; git rev-parse HEAD
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort
          test "$(git hash-object docs/qa/mig-r04/20261021-registry-replay.json)" = e3e1e6d3e528bb1c31ceda3acc5637f95fd64e4b
          test "$(git hash-object docs/qa/mig-r04/20261022-20261125-replay.json)" = 13672e7ee86c70a5f1f1b274a2b7fed6302fa107
          test "$(git hash-object docs/qa/mig-r04/observed-staging-reconciliation.sql)" = edec7fdfa79ca96ddb979301d2b325e2f8c72ce0
          work="$(mktemp -d)"
          cd "$work"
          supabase init
          mkdir -p supabase/migrations
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          source = Path(os.environ["GITHUB_WORKSPACE"]) / "docs/qa/mig-r04/20261021-registry-replay.json"
          rows = json.loads(source.read_text())["migrations"]
          later = source.with_name("20261022-20261125-replay.json")
          rows += json.loads(later.read_text())["migrations"]
          assert len(rows) == 159
          reconciliation = source.with_name("observed-staging-reconciliation.sql")
          rows.append({"version": "20261125100943", "name": "diagnostic_canonical_reconciliation", "sql": reconciliation.read_text()})
          assert len(rows) == 160
          assert len({r["version"] for r in rows}) == len(rows)
          for row in rows:
              assert re.fullmatch(r"\d{14}", row["version"])
              assert re.fullmatch(r"[a-z0-9_]+", row["name"])
              path = Path("supabase/migrations") / (row["version"] + "_" + row["name"] + ".sql")
              path.write_text(row["sql"].rstrip() + "\n")
          print("Candidate canonical sequence: 160 local-only migrations")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("supabase/config.toml")
          s = p.read_text()
          s, n = re.subn(r'(?m)^major_version\s*=\s*\d+', 'major_version = 17', s)
          assert n == 1, "Missing or ambiguous local PG version"
          p.write_text(s)
          PY
          trap 'supabase stop --no-backup >/dev/null 2>&1 || true; cd /; rm -rf "$work"' EXIT
          supabase start
          supabase status -o json > "$work/local-status.json"
          python3 - <<'PY'
          import json, urllib.request, urllib.error, uuid, secrets
          from pathlib import Path
          cfg=json.loads(Path("local-status.json").read_text())
          base=cfg["API_URL"]
          assert base.startswith(("http://127.0.0.1:", "http://localhost:"))
          anon=cfg.get("ANON_KEY") or cfg["PUBLISHABLE_KEY"]
          service=cfg.get("SERVICE_ROLE_KEY") or cfg["SECRET_KEY"]
          def request(path, key, token=None, method="GET", data=None):
              headers={"apikey":key,"Content-Type":"application/json","Prefer":"return=representation"}
              if token: headers["Authorization"]="Bearer "+token
              req=urllib.request.Request(base+path, headers=headers, method=method, data=None if data is None else json.dumps(data).encode())
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read()
                      return r.status,json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  return e.code,None
          def expect(label,condition):
              if not condition: raise SystemExit("FAIL "+label)
              print("PASS "+label)
          actors=[]
          for label in ("a","b"):
              email="sec-r01-"+label+"@example.invalid"
              password=secrets.token_urlsafe(32)
              code,u=request("/auth/v1/admin/users",service,service,"POST",{"email":email,"password":password,"email_confirm":True})
              expect(label+" create Auth identity",code in (200,201) and bool(u and u.get("id")))
              code,s=request("/auth/v1/token?grant_type=password",anon,None,"POST",{"email":email,"password":password})
              expect(label+" real Auth login",code==200 and s["user"]["id"]==u["id"] and bool(s["access_token"]))
              op=str(uuid.uuid4())
              exp=str(uuid.uuid4())
              actors.append((u["id"],s["access_token"],op,exp,s["refresh_token"]))
              for table,data in [
                  ("operators",{"id":op,"slug":"sec-r01-"+label,"name":"Synthetic "+label,"published":False,"operator_code":None}),
                  ("operator_memberships",{"operator_id":op,"user_id":u["id"],"role":"owner"}),
                  ("experiences",{"id":exp,"operator_id":op,"slug":"sec-r01-exp-"+label,"name":"Synthetic experience "+label,"published":False,"review_status":"draft"})]:
                  code,_=request("/rest/v1/"+table,service,service,"POST",data)
                  expect(label+" fixture "+table,code in (200,201,204))
          Path("actors.json").write_text(json.dumps(actors))
          PY
          chmod 600 "$work/actors.json" "$work/local-status.json"
          export NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$(python3 -c 'import json; d=json.load(open("local-status.json")); print(d.get("ANON_KEY") or d["PUBLISHABLE_KEY"])')"
          export SUPABASE_SERVICE_ROLE_KEY="$(python3 -c 'import json; d=json.load(open("local-status.json")); print(d.get("SERVICE_ROLE_KEY") or d["SECRET_KEY"])')"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          export SUPABASE_SECRET_KEY="$SUPABASE_SERVICE_ROLE_KEY"
          unset BIMARIS_SURVEY_PUBLIC_ONLY BIMARIS_SURVEY_PUBLIC_PROJECT_ID VERCEL_PROJECT_ID BIMARIS_PRELAUNCH_MODE BIMARIS_PRELAUNCH_AUDIT VERCEL_ENV
          # The survey proxy fails closed on presence of either setting, even false.
          export NEXT_TELEMETRY_DISABLED=1
          export SEC_R01_ACTORS="$work/actors.json"
          cd "$GITHUB_WORKSPACE/apps/web"
          pnpm exec next dev --hostname 127.0.0.1 --port 3100 > "$work/next.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; cd "$work"; supabase stop --no-backup >/dev/null 2>&1 || true; cd /; rm -rf "$work"' EXIT
          for attempt in $(seq 1 90); do
            if curl -s -o /dev/null http://127.0.0.1:3100/accedi; then break; fi
            sleep 2
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createServerClient} from '@supabase/ssr';
          const actors=JSON.parse(readFileSync(process.env.SEC_R01_ACTORS,'utf8'));
          const base='http://127.0.0.1:3100';
          const cookies=[];
          for(const [uid,token,op,exp,refresh] of actors){
            // Recover a genuine session with a new password login; no fabricated JWT.
            const jar=new Map();
            const client=createServerClient(process.env.NEXT_PUBLIC_SUPABASE_URL,process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,{cookies:{getAll:()=>[...jar].map(([name,value])=>({name,value})),setAll:items=>items.forEach(({name,value})=>jar.set(name,value))}});
            // Session token from the prior real login needs its actual refresh token.
            
            const {error}=await client.auth.setSession({access_token:token,refresh_token:refresh});
            assert.ifError(error);
            assert.ok(jar.size);
            cookies.push([...jar].map(([k,v])=>k+'='+v).join('; '));
          }
          const {chromium}=await import('file://'+process.env.RUNNER_TEMP+'/sec-r01-browser/node_modules/playwright/index.mjs');
          const {createClient}=await import('@supabase/supabase-js');
          const db=createClient(process.env.NEXT_PUBLIC_SUPABASE_URL,process.env.SUPABASE_SERVICE_ROLE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
          let count=0;
          function check(label,condition){assert.ok(condition,label);count++;console.log('PASS '+label);}
          const ids=actors.map(a=>a[2]);
          const notices=[];
          for(let i=0;i<2;i++){
            const {data,error}=await db.from('operator_notifications').insert({operator_id:ids[i],category:'profile',event_key:'sec-r01-'+i,title:'Private notice '+i,description:'Synthetic confidential marker '+i}).select('id').single();
            assert.ifError(error);notices.push(data.id);
          }
          async function snapshot(){
            const result={};
            for(const table of ['operators','experiences','operator_memberships','operator_revisions','experience_operators','operator_notifications']){
              const query=db.from(table).select('*').in(table==='operators'?'id':table==='experience_operators'?'experience_id':'operator_id',table==='experience_operators'?actors.map(a=>a[3]):ids).order(table==='operator_memberships'?'user_id':table==='experience_operators'?'experience_id':'id');
              const {data,error}=await query;assert.ifError(error);result[table]=data;
            }
            return result;
          }
          const before=await snapshot();
          const browser=await chromium.launch({headless:true});
          try{
            for(let i=0;i<2;i++){
              const other=1-i;
              const context=await browser.newContext({viewport:{width:390,height:844}});
              try{
                // Explicitly block nonlocal network, including analytics and email providers.
                await context.route('**/*',route=>{const u=new URL(route.request().url());return ['127.0.0.1','localhost'].includes(u.hostname)?route.continue():route.abort();});
                await context.addCookies(cookies[i].split('; ').map(pair=>{const k=pair.indexOf('=');return {name:pair.slice(0,k),value:pair.slice(k+1),url:base};}));
                const page=await context.newPage();
                await page.goto(base+'/area-operatore?operatore='+ids[i]);
                await page.getByText('Synthetic '+(i===0?'a':'b'),{exact:true}).first().waitFor({timeout:20000});
                check('browser own workspace '+i,true);
                await page.goto(base+'/area-operatore?operatore='+ids[other]);
                await page.getByRole('heading',{name:'Questo operatore non è associato al tuo account.'}).waitFor({timeout:20000});
                check('browser foreign workspace denied '+i,!(await page.locator('body').innerText()).includes('Synthetic experience '+(other===0?'a':'b')));
                await page.goto(base+'/area-operatore?operatore='+ids[i]);
                const results=await page.evaluate(async ({own,foreign,foreignNotice,foreignExp})=>{
                  const api='/api/operator/notifications';
                  const get=async id=>{const r=await fetch(api+'?operatorId='+id);return {status:r.status,body:await r.json()};};
                  const post=async(path,body)=>{const r=await fetch(path,{method:'POST',body,redirect:'manual',headers:body instanceof URLSearchParams?{}:{'Content-Type':'application/json'}});return r.status;};
                  return {own:await get(own),foreign:await get(foreign),mark:await post(api,JSON.stringify({operatorId:foreign,action:'read-all'})),targeted:await post(api,JSON.stringify({operatorId:own,action:'read',kind:'operator',notificationId:foreignNotice})),profile:await post('/api/operator/profile-revisions',new URLSearchParams({operator_id:foreign,name:'Forbidden mutation'})),collaboration:await post('/api/operator/collaborations',new URLSearchParams({operator_id:foreign,experience_id:foreignExp,decision:'accepted'}))};
                },{own:ids[i],foreign:ids[other],foreignNotice:notices[other],foreignExp:actors[other][3]});
                check('own seeded notification '+i,results.own.status===200&&results.own.body.notifications.some(n=>n.id===notices[i]&&!n.read));
                check('foreign notification absent '+i,!results.own.body.notifications.some(n=>n.id===notices[other]));
                check('foreign notification endpoint '+i,results.foreign.status===403);
                check('foreign read-all denied '+i,results.mark===403);
                check('foreign targeted write response '+i,results.targeted===200);
                check('profile redirect '+i,results.profile===0||results.profile===303);
                check('collaboration redirect '+i,results.collaboration===0||results.collaboration===303);
              }finally{await context.close();}
            }
            const after=await snapshot();
            for(const table of Object.keys(before))check('unchanged '+table,JSON.stringify(before[table])===JSON.stringify(after[table]));
            const context=await browser.newContext();
            try{
              await context.route('**/*',route=>{const u=new URL(route.request().url());return ['127.0.0.1','localhost'].includes(u.hostname)?route.continue():route.abort();});
              const page=await context.newPage();
              const requested='/area-operatore?operatore='+ids[0];
              const initial=await fetch(base+requested,{redirect:'manual'});
              console.log('Anonymous initial HTTP '+initial.status+'; redirect header present '+Boolean(initial.headers.get('location')));
              const html=await initial.text();
              assert.ok(!html.includes('Synthetic experience a')&&!html.includes('Synthetic experience b'),'Anonymous HTTP response must not contain private experiences');
              await page.goto(base+requested);
              try{await page.waitForURL(u=>u.origin===base&&u.pathname==='/accedi/operatore',{timeout:20000});}
              catch(error){console.log('Anonymous final pathname '+new URL(page.url()).pathname+'; page title '+await page.title());throw error;}
              const destination=new URL(page.url());
              check('anonymous browser redirected',destination.origin===base&&destination.pathname==='/accedi/operatore'&&destination.searchParams.get('next')===requested);
            }finally{await context.close();}
          }finally{await browser.close();}
          console.log('SEC-R01 BROWSER AND INTEGRITY PASS '+count+' checks');
          JS
