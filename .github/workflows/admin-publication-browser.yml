name: Admin publication browser isolated
on:
  push:
    branches: [fix/dt16-isolated-survey-surface-20261117]
    paths: ['.github/workflows/admin-publication-browser.yml','apps/web/tests/admin-publication-browser.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    if: github.ref == 'refs/heads/fix/dt16-isolated-survey-surface-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: |
          npm install --prefix "$RUNNER_TEMP/admin-browser" --no-audit --no-fund playwright@1.58.2 esbuild@0.27.3
          "$RUNNER_TEMP/admin-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise real React publication buttons with isolated synthetic responses
        run: node apps/web/tests/admin-publication-browser.mjs
