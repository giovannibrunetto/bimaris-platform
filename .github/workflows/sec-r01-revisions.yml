name: SEC-R01 isolated revision lifecycle
on:
  push:
    branches: [fix/dt16-isolated-survey-surface-20261117]
    paths: ['.github/workflows/sec-r01-revisions.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sec-r01-revisions
  cancel-in-progress: false
jobs:
  replay:
    if: github.ref == 'refs/heads/fix/dt16-isolated-survey-surface-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Replay canonical schema and test revision authorization
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD DATABASE_URL
          test ! -f supabase/.temp/project-ref
          test -d supabase/migrations
          printf 'Candidate commit: '; git rev-parse HEAD
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort
          test "$(git hash-object docs/qa/mig-r04/20261021-registry-replay.json)" = e3e1e6d3e528bb1c31ceda3acc5637f95fd64e4b
          test "$(git hash-object docs/qa/mig-r04/20261022-20261125-replay.json)" = 13672e7ee86c70a5f1f1b274a2b7fed6302fa107
          test "$(git hash-object docs/qa/mig-r04/observed-staging-reconciliation.sql)" = edec7fdfa79ca96ddb979301d2b325e2f8c72ce0
          work="$(mktemp -d)"
          cd "$work"
          supabase init
          mkdir -p supabase/migrations
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          source = Path(os.environ["GITHUB_WORKSPACE"]) / "docs/qa/mig-r04/20261021-registry-replay.json"
          rows = json.loads(source.read_text())["migrations"]
          later = source.with_name("20261022-20261125-replay.json")
          rows += json.loads(later.read_text())["migrations"]
          assert len(rows) == 159
          reconciliation = source.with_name("observed-staging-reconciliation.sql")
          rows.append({"version": "20261125100943", "name": "diagnostic_canonical_reconciliation", "sql": reconciliation.read_text()})
          assert len(rows) == 160
          assert len({r["version"] for r in rows}) == len(rows)
          for row in rows:
              assert re.fullmatch(r"\d{14}", row["version"])
              assert re.fullmatch(r"[a-z0-9_]+", row["name"])
              path = Path("supabase/migrations") / (row["version"] + "_" + row["name"] + ".sql")
              path.write_text(row["sql"].rstrip() + "\n")
          print("Candidate canonical sequence: 160 local-only migrations")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("supabase/config.toml")
          s = p.read_text()
          s, n = re.subn(r'(?m)^major_version\s*=\s*\d+', 'major_version = 17', s)
          assert n == 1, "Missing or ambiguous local PG version"
          p.write_text(s)
          PY
          trap 'supabase stop --no-backup >/dev/null 2>&1 || true; cd /; rm -rf "$work"' EXIT
          supabase start
          supabase status -o json > "$work/local-status.json"
          python3 - <<'PY'
          import json, urllib.request, urllib.error, uuid, secrets
          from pathlib import Path
          cfg=json.loads(Path("local-status.json").read_text())
          base=cfg["API_URL"]
          assert base.startswith(("http://127.0.0.1:", "http://localhost:"))
          anon=cfg.get("ANON_KEY") or cfg["PUBLISHABLE_KEY"]
          service=cfg.get("SERVICE_ROLE_KEY") or cfg["SECRET_KEY"]
          def request(path, key, token=None, method="GET", data=None):
              headers={"apikey":key,"Content-Type":"application/json","Prefer":"return=representation"}
              if token: headers["Authorization"]="Bearer "+token
              req=urllib.request.Request(base+path, headers=headers, method=method, data=None if data is None else json.dumps(data).encode())
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read()
                      return r.status,json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  return e.code,None
          def expect(label,condition):
              if not condition: raise SystemExit("FAIL "+label)
              print("PASS "+label)
          actors=[]
          for label in ("a","b"):
              email="sec-r01-"+label+"@example.invalid"
              password=secrets.token_urlsafe(32)
              code,u=request("/auth/v1/admin/users",service,service,"POST",{"email":email,"password":password,"email_confirm":True})
              expect(label+" create Auth identity",code in (200,201) and bool(u and u.get("id")))
              code,s=request("/auth/v1/token?grant_type=password",anon,None,"POST",{"email":email,"password":password})
              expect(label+" real Auth login",code==200 and s["user"]["id"]==u["id"] and bool(s["access_token"]))
              op=str(uuid.uuid4())
              exp=str(uuid.uuid4())
              actors.append((u["id"],s["access_token"],op,exp,s["refresh_token"]))
              for table,data in [
                  ("operators",{"id":op,"slug":"sec-r01-"+label,"name":"Synthetic "+label,"published":False,"operator_code":None}),
                  ("operator_memberships",{"operator_id":op,"user_id":u["id"],"role":"owner"}),
                  ("experiences",{"id":exp,"operator_id":op,"slug":"sec-r01-exp-"+label,"name":"Synthetic experience "+label,"published":False,"review_status":"draft"})]:
                  code,_=request("/rest/v1/"+table,service,service,"POST",data)
                  expect(label+" fixture "+table,code in (200,201,204))
          Path("actors.json").write_text(json.dumps(actors))
          PY
          chmod 600 "$work/actors.json" "$work/local-status.json"
          export NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$(python3 -c 'import json; d=json.load(open("local-status.json")); print(d.get("ANON_KEY") or d["PUBLISHABLE_KEY"])')"
          export SUPABASE_SERVICE_ROLE_KEY="$(python3 -c 'import json; d=json.load(open("local-status.json")); print(d.get("SERVICE_ROLE_KEY") or d["SECRET_KEY"])')"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          export SUPABASE_SECRET_KEY="$SUPABASE_SERVICE_ROLE_KEY"
          unset BIMARIS_SURVEY_PUBLIC_ONLY BIMARIS_SURVEY_PUBLIC_PROJECT_ID VERCEL_PROJECT_ID BIMARIS_PRELAUNCH_MODE BIMARIS_PRELAUNCH_AUDIT VERCEL_ENV
          # The survey proxy fails closed on presence of either setting, even false.
          export NEXT_TELEMETRY_DISABLED=1
          export SEC_R01_ACTORS="$work/actors.json"
          cd "$GITHUB_WORKSPACE/apps/web"
          pnpm exec next dev --hostname 127.0.0.1 --port 3100 > "$work/next.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; cd "$work"; supabase stop --no-backup >/dev/null 2>&1 || true; cd /; rm -rf "$work"' EXIT
          for attempt in $(seq 1 90); do
            if curl -s -o /dev/null http://127.0.0.1:3100/accedi; then break; fi
            sleep 2
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createServerClient} from '@supabase/ssr';
          const actors=JSON.parse(readFileSync(process.env.SEC_R01_ACTORS,'utf8'));
          const base='http://127.0.0.1:3100';
          const cookies=[];
          for(const [uid,token,op,exp,refresh] of actors){
            // Recover a genuine session with a new password login; no fabricated JWT.
            const jar=new Map();
            const client=createServerClient(process.env.NEXT_PUBLIC_SUPABASE_URL,process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,{cookies:{getAll:()=>[...jar].map(([name,value])=>({name,value})),setAll:items=>items.forEach(({name,value})=>jar.set(name,value))}});
            // Session token from the prior real login needs its actual refresh token.
            
            const {error}=await client.auth.setSession({access_token:token,refresh_token:refresh});
            assert.ifError(error);
            assert.ok(jar.size);
            cookies.push([...jar].map(([k,v])=>k+'='+v).join('; '));
          }
          const {createClient}=await import('@supabase/supabase-js');
          const {randomUUID}=await import('node:crypto');
          const url=process.env.NEXT_PUBLIC_SUPABASE_URL;
          const anon=process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY;
          const opts={auth:{persistSession:false,autoRefreshToken:false}};
          const db=createClient(url,process.env.SUPABASE_SERVICE_ROLE_KEY,opts);
          const publicClient=createClient(url,anon,opts);
          const clients=actors.map(a=>createClient(url,anon,{...opts,global:{headers:{Authorization:'Bearer '+a[1]}}}));
          let count=0;
          function check(label,condition){assert.ok(condition,label);count++;console.log('PASS '+label);}
          async function read(table,id){const {data,error}=await db.from(table).select('*').eq('id',id).single();assert.ifError(error);return data;}
          async function seedUpdate(table,id,values){const {error}=await db.from(table).update(values).eq('id',id);assert.ifError(error);}
          async function adminCall(id,cookie,origin){
            const response=await fetch(base+'/api/admin/experience-revisions',{method:'POST',redirect:'manual',headers:{'sec-fetch-site':origin?'cross-site':'same-origin',...(origin?{origin}:{}),...(cookie?{cookie}:{})},body:new URLSearchParams({revision_id:id,action:'approve-apply'})});
            console.log('Admin HTTP '+response.status+' location '+(response.headers.get('location')?new URL(response.headers.get('location'),base).pathname:'none'));
            if(response.status===403){const payload=await response.clone().json().catch(()=>null);console.log('Admin rejection '+String(payload?.error??'unknown'));}
            return response;
          }
          const rpc=(c,id)=>c.rpc('admin_apply_experience_revision',{p_revision_id:id,p_review_notes:'Synthetic review'});
          const revisions=[];
          for(let i=0;i<2;i++){
            const [uid,token,op,exp]=actors[i];
            await seedUpdate('operators',op,{published:true,selection_status:'selected'});
            await seedUpdate('experiences',exp,{published:true,review_status:'approved'});
            const id=randomUUID(),content={name:'Proposed synthetic '+i};
            const result=await clients[i].from('experience_revisions').insert({id,experience_id:exp,operator_id:op,status:'draft',content}).select('id').single();
            check('owner creates draft '+i,!result.error&&result.data?.id===id);
            const initialized=await read('experience_revisions',id);
            check('draft initialized from live '+i,initialized.content.name===(await read('experiences',exp)).name);
            const proposed={...initialized.content,name:content.name};
            const edit=await clients[i].from('experience_revisions').update({content:proposed}).eq('id',id).select('id').single();
            check('owner edits draft '+i,!edit.error&&edit.data?.id===id);
            const webp=Buffer.from('UklGRhwAAABXRUJQVlA4TA8AAAAvAUAAAAcQ/Y/+ByKi/wEA','base64');
            const path=op+'/'+exp+'/fixture.webp';
            const upload=await db.storage.from('experience-media').upload(path,webp,{contentType:'image/webp'});
            assert.ifError(upload.error);
            const media=await db.from('experience_media').insert({experience_id:exp,storage_path:path,is_cover:true}).select('id').single();
            assert.ifError(media.error);
            const link=await clients[i].from('experience_revision_media').insert({revision_id:id,operator_id:op,source_media_id:media.data.id,storage_path:path,is_cover:true});
            check('owner links existing cover '+i,!link.error);
            revisions.push({id,op,exp,content:(await read('experience_revisions',id)).content});
          }
          for(let i=0;i<2;i++){
            const f=revisions[i],own=clients[i],other=clients[1-i];
            const initial=await read('experiences',f.exp);
            const hidden=await other.from('experience_revisions').select('id').eq('id',f.id);
            check('foreign revision hidden '+i,!hidden.error&&hidden.data.length===0);
            const forged=await other.from('experience_revisions').insert({id:randomUUID(),experience_id:f.exp,operator_id:f.op,status:'draft',content:{name:'Forbidden'}});
            check('foreign draft creation denied '+i,!!forged.error);
            await other.from('experience_revisions').update({content:{name:'Forbidden'}}).eq('id',f.id);
            check('foreign mutation no effect '+i,JSON.stringify((await read('experience_revisions',f.id)).content)===JSON.stringify(f.content));
            const selfApply=await own.from('experience_revisions').update({status:'applied'}).eq('id',f.id);
            check('self approval denied '+i,!!selfApply.error&&(await read('experience_revisions',f.id)).status==='draft');
            const submitted=await own.from('experience_revisions').update({status:'pending',submitted_at:new Date().toISOString()}).eq('id',f.id).select('id').single();
            check('owner submission '+i,!submitted.error&&submitted.data?.id===f.id);
            await own.from('experience_revisions').update({content:{name:'Late change'}}).eq('id',f.id);
            check('pending revision locked '+i,JSON.stringify((await read('experience_revisions',f.id)).content)===JSON.stringify(f.content));
            for(const [label,c] of [['owner',own],['foreign',other],['anonymous',publicClient]]){
              const result=await rpc(c,f.id);
              check(label+' privileged RPC denied '+i,!!result.error);
            }
            for(const [label,cookie] of [['owner',cookies[i]],['foreign',cookies[1-i]],['anonymous',undefined]]){
              const result=await adminCall(f.id,cookie);
              check(label+' admin route denied '+i,result.status===303&&new URL(result.headers.get('location'),base).pathname==='/admin/login');
            }
            check('cross origin admin rejected '+i,(await adminCall(f.id,cookies[i],'https://example.invalid')).status===403);
            check('live experience unchanged before apply '+i,JSON.stringify(await read('experiences',f.exp))===JSON.stringify(initial));
            const applied=await rpc(db,f.id);
            check('service RPC applies revision '+i,!applied.error);
            const after=await read('experiences',f.exp),rev=await read('experience_revisions',f.id);
            check('applied content and publication preserved '+i,after.name===f.content.name&&after.published===initial.published&&after.operator_id===f.op&&after.review_status==='approved');
            check('revision applied timestamps '+i,rev.status==='applied'&&!!rev.applied_at&&!!rev.reviewed_at);
            const replay=await rpc(db,f.id);
            check('repeat approval denied '+i,!!replay.error&&replay.error.message.includes('invalid-review-state'));
            check('repeat approval no effect '+i,JSON.stringify(await read('experiences',f.exp))===JSON.stringify(after));
          }
          console.log('SEC-R01 REVISION LIFECYCLE PASS '+count+' checks; positive admin HTTP gate not covered');
          JS
